<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Beast Card Printer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/card-tool.css">
</head>

<body>
    <div id="overlay" class="overlay">
        <div class="ring"></div>
        <div id="overlay-text" class="overlay-text">Loading...</div>
    </div>
    <div id="app">
        <header id="workspace-bar">
            <div class="workspace-zone workspace-brand"><span class="brand-mark" data-icon="brand" role="img"
                    aria-label=""></span>
                <h1 id="page-title"></h1>
            </div>
            <div class="workspace-zone workspace-selection"><button id="selection-count-trigger" type="button"
                    class="count-trigger" aria-label="Manage selection: 0 selected" data-tip="Manage selection"><strong
                        id="selection-count">0</strong><span class="selection-label"> selected</span></button></div>
            <div class="workspace-actions"><button id="toggle-browse" class="btn" type="button"
                    aria-label="Browse cards" data-tip="Browse cards"><span class="btn-icon" data-icon="browse"
                        aria-hidden="true"></span><span class="btn-label">Browse</span></button>
                <div class="workspace-zone workspace-book"><button id="save-book" class="btn book-action" type="button"
                        aria-label="Save cardbook" data-tip="Save cardbook"><span class="btn-icon" data-icon="save"
                            aria-hidden="true"></span><span class="btn-label">Save</span></button><button id="load-book"
                        class="btn book-action" type="button" aria-label="Load cardbook" data-tip="Load cardbook"><span
                            class="btn-icon" data-icon="load" aria-hidden="true"></span><span
                            class="btn-label">Load</span></button></div>
                <div id="print-actions" class="workspace-zone workspace-presentation" hidden><span id="content-group" class="dropdown" data-dropdown="content"><button
                        class="dropdown-trigger" type="button" data-dropdown-trigger aria-haspopup="menu"
                        aria-expanded="false" aria-label="Content mode: Single card"
                        data-tip="Content mode: Single card"><span class="dropdown-icon" data-icon="single"
                            aria-hidden="true"></span><span class="dropdown-label">Single card</span><span
                            class="dropdown-caret" aria-hidden="true">▾</span></button><span id="content-menu"
                        class="dropdown-menu" data-menu="content" role="menu" aria-label="Content mode"
                        popover="manual"><button class="dropdown-item" type="button" role="menuitemradio"
                            tabindex="-1" aria-checked="true" data-content="single"><span class="dropdown-icon"
                                data-icon="single" aria-hidden="true"></span><span
                                class="dropdown-item-name">Single card</span></button><button class="dropdown-item"
                            type="button" role="menuitemradio" tabindex="-1" aria-checked="false"
                            data-content="overflow"><span class="dropdown-icon" data-icon="overflow"
                                aria-hidden="true"></span><span class="dropdown-item-name">Overflow</span></button></span></span><span
                        id="layout-group" class="dropdown" data-dropdown="layout"><button class="dropdown-trigger"
                            type="button" data-dropdown-trigger aria-haspopup="menu" aria-expanded="false"
                            aria-label="Card layout: Fronts" data-tip="Card layout: Fronts"><span
                                class="dropdown-icon" data-icon="fronts" aria-hidden="true"></span><span
                                class="dropdown-label">Fronts</span><span class="dropdown-caret"
                                aria-hidden="true">▾</span></button><span id="layout-menu" class="dropdown-menu"
                            data-menu="layout" role="menu" aria-label="Card layout" popover="manual"><button
                                class="dropdown-item" type="button" role="menuitemradio" tabindex="-1"
                                aria-checked="true" data-layout="fronts"><span class="dropdown-icon" data-icon="fronts"
                                    aria-hidden="true"></span><span class="dropdown-item-name">Fronts</span></button><button
                                class="dropdown-item" type="button" role="menuitemradio" tabindex="-1"
                                aria-checked="false" data-layout="backs"><span class="dropdown-icon" data-icon="backs"
                                    aria-hidden="true"></span><span class="dropdown-item-name">Backs</span></button><button
                                class="dropdown-item" type="button" role="menuitemradio" tabindex="-1"
                                aria-checked="false" data-layout="both"><span class="dropdown-icon" data-icon="both"
                                    aria-hidden="true"></span><span class="dropdown-item-name">Both</span></button></span></span><span
                        id="density-group" class="dropdown" data-dropdown="density"><button class="dropdown-trigger"
                            type="button" data-dropdown-trigger aria-haspopup="menu" aria-expanded="false"
                            aria-label="Preview density: Auto" data-tip="Preview density: Auto"><span
                                class="dropdown-icon" data-icon="auto" aria-hidden="true"></span><span
                                class="dropdown-label">Auto</span><span class="dropdown-caret"
                                aria-hidden="true">▾</span></button><span id="density-menu" class="dropdown-menu"
                            data-menu="density" role="menu" aria-label="Preview density" popover="manual"><button
                                class="dropdown-item" type="button" role="menuitemradio" tabindex="-1"
                                aria-checked="true" data-density="auto"><span class="dropdown-icon" data-icon="auto"
                                    aria-hidden="true"></span><span class="dropdown-item-name">Auto</span></button><button
                                class="dropdown-item" type="button" role="menuitemradio" tabindex="-1"
                                aria-checked="false" data-density="large"><span class="dropdown-icon" data-icon="large"
                                    aria-hidden="true"></span><span class="dropdown-item-name">Large</span></button><button
                                class="dropdown-item" type="button" role="menuitemradio" tabindex="-1"
                                aria-checked="false" data-density="grid"><span class="dropdown-icon" data-icon="grid"
                                    aria-hidden="true"></span><span class="dropdown-item-name">Grid</span></button></span></span><span
                        id="preview-mode-group" class="layout-group" role="group" aria-label="Preview mode"><button
                            class="layout-seg" type="button" data-preview="cards" aria-pressed="false"
                            aria-label="Cards view" data-tip="Cards view"><span class="btn-icon" data-icon="single"
                                aria-hidden="true"></span><span class="layout-seg-label">Cards</span></button><button
                            class="layout-seg" type="button" data-preview="pages" aria-pressed="true"
                            aria-label="Pages view" data-tip="Pages view"><span class="btn-icon" data-icon="fronts"
                                aria-hidden="true"></span><span class="layout-seg-label">Pages</span></button></span><span
                        id="inspection-side-group" class="layout-group" role="group" aria-label="Inspection side"
                        hidden><button class="layout-seg" type="button" data-inspect-side="front" aria-pressed="true"
                            aria-label="Show card fronts" data-tip="Show card fronts"><span class="btn-icon"
                                data-icon="fronts" aria-hidden="true"></span><span
                                class="layout-seg-label">Fronts</span></button><button class="layout-seg" type="button"
                            data-inspect-side="back" aria-pressed="false" aria-label="Show card backs"
                            data-tip="Show card backs"><span class="btn-icon" data-icon="backs"
                                aria-hidden="true"></span><span class="layout-seg-label">Backs</span></button></span><button id="print-cards"
                        class="btn primary" type="button" aria-label="Print" data-tip="Print"><span class="btn-icon"
                            data-icon="print" aria-hidden="true"></span><span class="btn-label">Print</span></button><button
                        id="debug-print" class="btn" type="button" aria-label="Debug Print"
                        data-tip="Debug Print"><span class="btn-icon" data-icon="debug" aria-hidden="true"></span><span
                            class="btn-label">Debug Print</span></button></div>
            </div>
        </header>
        <div id="masthead"><span class="brand-mark" data-icon="brand" role="img" aria-label=""></span><span
                id="masthead-title" class="masthead-title"></span></div>
        <aside id="sidebar">
            <div class="sidebar-head"><strong>Browse</strong><button id="close-browse" class="dialog-close"
                    type="button" aria-label="Close browse">×</button></div>
            <div class="sidebar-section"><input id="query" class="search" type="search"></div>
            <div id="filter-groups"></div>
            <div class="sidebar-section sort-row"><select id="sort" class="sort"></select></div>
            <div id="result-bar"><span id="result-count">0</span><button id="select-visible"
                    class="filter-action">Select visible</button></div>
            <div id="entity-list"></div>
        </aside>
        <main id="main">
            <div id="preview-wrap">
                <div id="placeholder" class="placeholder">
                    <div class="placeholder-icon">🎴</div>
                    <div class="placeholder-text">Select entries to preview cards</div>
                </div>
                <div id="screen-pages" hidden>
                    <div id="cards-gallery" class="gallery" hidden></div>
                    <div id="pages-canvas">
                        <div id="preview-grid"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <nav id="mobile-bar" aria-label="Workspace actions">
        <button type="button" data-surface="browse">Browse</button>
        <button type="button" data-surface="selected">Selected <span id="mobile-selected-count">0</span></button>
        <button type="button" data-surface="print">Print</button>
    </nav>
    <dialog id="selection-manager" class="manager" aria-labelledby="manager-title">
        <div class="dialog-head">
            <h2 id="manager-title">Manage selection</h2><button class="dialog-close" type="button" data-close-manager
                aria-label="Close selection manager">×</button>
        </div>
        <input id="manager-search" class="search" type="search" aria-label="Search selected cards" placeholder="Search selected...">
        <p id="manager-count">0 of 0 shown</p>
        <div id="manager-list" class="manager-list"></div>
        <div class="dialog-actions"><button id="manager-remove-shown" class="btn" type="button">Remove shown</button><button
                id="manager-clear" class="btn" type="button">Clear all</button></div>
    </dialog>
    <dialog id="save-book-dialog" class="manager" aria-labelledby="save-book-title">
        <div class="dialog-head">
            <h2 id="save-book-title">Save cardbook</h2><button class="dialog-close" type="button" data-close-save
                aria-label="Close save cardbook">×</button>
        </div>
        <label class="dialog-field" for="save-book-name">Name</label>
        <input id="save-book-name" class="search" type="text" autocomplete="off" spellcheck="false"
            placeholder="Cardbook name">
        <p id="save-book-status" class="dialog-status" role="status" aria-live="polite"></p>
        <div class="dialog-actions"><button id="save-book-confirm" class="btn primary" type="button">Save</button><button
                class="btn" type="button" data-close-save>Cancel</button></div>
    </dialog>
    <dialog id="load-book-dialog" class="manager" aria-labelledby="load-book-title">
        <div class="dialog-head">
            <h2 id="load-book-title">Load cardbook</h2><button class="dialog-close" type="button" data-close-load
                aria-label="Close load cardbook">×</button>
        </div>
        <p id="load-book-summary" class="dialog-status"></p>
        <div id="load-book-list" class="manager-list"></div>
        <p id="load-book-status" class="dialog-status" role="status" aria-live="polite"></p>
        <div class="dialog-actions"><button class="btn" type="button" data-close-load>Close</button></div>
    </dialog>
    <dialog id="print-sheet" class="sheet" aria-labelledby="print-sheet-title">
        <div class="dialog-head">
            <h2 id="print-sheet-title">Print</h2><button class="dialog-close" type="button" data-close-print
                aria-label="Close print options">×</button>
        </div>
        <div id="print-sheet-slot"></div>
    </dialog>
    <dialog id="card-detail" class="detail" aria-label="Card detail">
        <div class="detail-head"><button id="detail-close" class="dialog-close" type="button"
                aria-label="Close card detail">×</button><span id="detail-position" aria-live="polite"></span><button
                id="detail-flip" class="btn" type="button" hidden>Flip</button></div>
        <div id="detail-scroll">
            <div id="detail-stack"></div>
        </div>
        <div class="detail-foot"><button id="detail-prev" class="btn" type="button">Previous</button><button
                id="detail-next" class="btn" type="button">Next</button></div>
    </dialog>
    <div id="print-debug-bar" aria-live="polite">
        <button id="btn-toggle-bg" type="button">Background Graphics: ON</button>
        <button id="btn-exit-debug" type="button">Exit Print Debug</button>
    </div>
    <div id="print-area"></div>
    <script src="js/card-tool-utils.js" type="module"></script>
    <script src="js/card-tool-flow.js" type="module"></script>
    <script src="js/card-tool-pages.js" type="module"></script>
    <script src="js/card-tool-layout.js" type="module"></script>
    <script src="js/card-tool-cardbooks.js" type="module"></script>
    <script src="js/card-tool-icons.js" type="module"></script>
    <script src="js/card-tool.js" type="module"></script>
    <script src="js/beast-cards.js" type="module"></script>
</body>

</html>
